[project]
name = "whycode"
version = "0.1.0"
description = "Answers why a piece of CockroachDB schema-change code is the way it is: Decisions, Supersession and Fence Warnings for coding agents."
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.40",
    "mcp>=1.2",
    "neo4j>=5.28",
    "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whycode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
