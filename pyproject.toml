[project]
name = "whycode"
version = "0.1.0"
description = "Answers why a piece of CockroachDB schema-change code is the way it is: Decisions, Supersession and Fence Warnings for coding agents."
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.11,<3",
    "fastembed>=0.9.1",
    "mcp>=2.3,<3",
    "neo4j>=6.4,<7",
    "numpy>=2.5.5",
    "openai>=3.57,<4",
    "pydantic>=2.7",
    "pyyaml>=6.0.3",
    "tree-sitter>=0.26,<0.27",
    "tree-sitter-go>=0.25,<0.26",
]

[project.scripts]
whycode = "whycode.cli:main"
why-mcp = "whycode.mcp_server:main"
whycode-eval = "whycode.eval.cli:main"
whycode-agents = "whycode.comparison.cli:main"

[dependency-groups]
dev = [
    "anyio>=4",
    "pytest>=8",
    "testcontainers[neo4j]>=4.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whycode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
